# Cinder distributed cache server configuration.
# CLI flags override these values when both are provided.
server:
  port: 7000
  node_id: node1
  capacity: 67108864          # 64 MB
  rpc_timeout_ms: 5000        # per-RPC deadline (0 = no timeout)
  replication_factor: 1
  consistency: async          # async | quorum
  metrics_port: 0             # Prometheus metrics port (0 = disabled)

cluster:
  peers: []
  # peers:
  #   - id: node2
  #     host: 127.0.0.1
  #     port: 7001
  #   - id: node3
  #     host: 127.0.0.1
  #     port: 7002

failure_detector:
  ping_interval_ms: 1000
  suspect_timeout_ms: 3000
  gossip_interval_ms: 1000
  quarantine_interval_ms: 10000

anti_entropy:
  interval_ms: 30000         # repair interval (0 = disabled)
  buckets: 256               # hash bucket count
  fetch_bytes: 1048576       # per-round repair fetch budget (1 MB)
  full_rehash_interval_ms: 300000  # full-rehash backstop interval

replication:
  max_hint_bytes: 67108864      # hinted-handoff byte budget (drop-oldest past it)
  tombstone_gc_ms: 300000       # delete-marker GC grace (must exceed worst-case partition healing)

persistence:
  enabled: false              # WAL + snapshot persistence
  data_dir: /var/lib/cinder   # directory for WAL and snapshot files
  snapshot_interval_s: 60     # periodic compaction interval
  max_wal_entries: 10000      # auto-compact threshold (WAL entries since last snapshot)
  max_wal_bytes: 67108864     # auto-compact threshold in bytes, sealed + active (0 = disabled)
  max_wal_segment_bytes: 16777216  # seal active WAL into wal_<seq>.log past this size (0 = disabled)
  max_sealed_segments: 32     # force compaction past this many sealed segments (0 = disabled)
  wal_fsync: false            # fdatasync on every WAL flush (durability vs throughput)

tls:
  enabled: false
  cert_file: /etc/cinder/cert.pem   # server certificate chain (PEM)
  key_file: /etc/cinder/key.pem     # server private key (PEM)
  ca_file: /etc/cinder/ca.pem       # CA cert for peer verification (PEM, optional)

auth:
  shared_secret: ""                 # shared secret for node authentication (empty = disabled)
  client_shared_secret: ""         # shared secret for client auth (empty = disabled, requires TLS)

logging:
  level: info                # trace | debug | info | warn | error

grpc:
  port: 0                    # gRPC gateway port (0 = disabled, requires CINDER_ENABLE_GRPC build)
