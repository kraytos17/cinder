name: Go

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: go-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    runs-on: ubuntu-26.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true
          cache-dependency-path: go.mod

      - name: Set up just
        uses: extractions/setup-just@v4
        with:
          just-version: "1"

      - name: Formatting and vet
        run: just vet

      - name: Lint
        run: just lint

      - name: Vulnerability scan
        run: just vuln

      - name: Proto lint and generated stubs
        run: just proto-check

      - name: Module exactness
        run: go mod tidy && git diff --exit-code -- go.mod go.sum

      - name: Build
        run: just build

      - name: Race tests (including fuzz seed corpus)
        run: just test-race

      - name: Fuzz targets (20s each, parallel)
        env:
          GOMAXPROCS: "1"
        run: |
          set -euo pipefail
          pids=()
          just fuzz-one FuzzDecodeRequest internal/net/protocol & pids+=("$!")
          just fuzz-one FuzzDecodeResponse internal/net/protocol & pids+=("$!")
          just fuzz-one FuzzGossipView internal/cluster & pids+=("$!")
          just fuzz-one FuzzWALReader internal/persist & pids+=("$!")
          just fuzz-one FuzzSnapshot internal/persist & pids+=("$!")
          just fuzz-one FuzzAECodecs internal/ae & pids+=("$!")
          just fuzz-one FuzzStoreSequence internal/store & pids+=("$!")
          just fuzz-one FuzzCounterCodec internal/counter & pids+=("$!")
          result=0
          for pid in "${pids[@]}"; do
            if ! wait "$pid"; then result=1; fi
          done
          exit "$result"
