name: Go

on:
  push:
  pull_request:

jobs:
  go:
    runs-on: ubuntu-26.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: gofmt
        run: test -z "$(gofmt -l .)"

      - name: go vet
        run: go vet ./...

      - name: Build
        run: go build ./...

      - name: Tests (incl. fuzz seed corpus, race detector)
        run: go test -race ./...

      - name: Fuzz protocol codec (request fixed point)
        run: go test -run=NONE -fuzz=FuzzDecodeRequest -fuzztime=20s ./internal/net/protocol/

      - name: Fuzz protocol codec (response fixed point)
        run: go test -run=NONE -fuzz=FuzzDecodeResponse -fuzztime=20s ./internal/net/protocol/

      - name: Fuzz gossip view codec
        run: go test -run=NONE -fuzz=FuzzGossipView -fuzztime=20s ./internal/cluster/

      - name: Fuzz WAL reader
        run: go test -run=NONE -fuzz=FuzzWALReader -fuzztime=20s ./internal/persist/

      - name: Fuzz snapshot decoder
        run: go test -run=NONE -fuzz=FuzzSnapshot -fuzztime=20s ./internal/persist/

      - name: Fuzz anti-entropy codecs
        run: go test -run=NONE -fuzz=FuzzAECodecs -fuzztime=20s ./internal/ae/

      - name: Fuzz store op sequences
        run: go test -run=NONE -fuzz=FuzzStoreSequence -fuzztime=20s ./internal/store/

      - name: Fuzz counter codecs
        run: go test -run=NONE -fuzz=FuzzCounterCodec -fuzztime=20s ./internal/counter/
