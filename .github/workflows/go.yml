name: Go

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: go-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    runs-on: ubuntu-26.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true
          cache-dependency-path: go.mod

      - name: Set up just
        uses: extractions/setup-just@v4
        with:
          just-version: "1"

      - name: Formatting and vet
        run: just vet

      - name: Lint
        run: just lint

      - name: Vulnerability scan
        run: just vuln

      - name: Proto lint and generated stubs
        run: just proto-check

      - name: Module exactness
        run: go mod tidy && git diff --exit-code -- go.mod go.sum

      - name: Build
        run: just build

      - name: Race tests (including fuzz seed corpus)
        run: just test-race

  perf:
    runs-on: ubuntu-26.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true
          cache-dependency-path: go.mod

      - name: Allocation guards (deterministic merge gate)
        run: go test -run TestAllocs -count=1 ./...

      - name: Benchmark smoke (advisory; ns/op is same-host only)
        run: go test ./... -run='^$' -bench=. -benchmem -benchtime=1x -count=1

  fuzz:
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        include:
          - { target: FuzzDecodeRequest, package: internal/net/protocol }
          - { target: FuzzDecodeResponse, package: internal/net/protocol }
          - { target: FuzzGossipView, package: internal/cluster }
          - { target: FuzzWALReader, package: internal/persist }
          - { target: FuzzWALCounterStateRecord, package: internal/persist }
          - { target: FuzzSnapshot, package: internal/persist }
          - { target: FuzzJournalImage, package: internal/ae }
          - { target: FuzzIBLTDifference, package: internal/ae }
          - { target: FuzzAEDigest, package: internal/ae }
          - { target: FuzzAERefinement, package: internal/ae }
          - { target: FuzzAEMetaRows, package: internal/ae }
          - { target: FuzzAESync, package: internal/ae }
          - { target: FuzzAEIBLT, package: internal/ae }
          - { target: FuzzAEGroupDigest, package: internal/ae }
          - { target: FuzzStoreSequence, package: internal/store }
          - { target: FuzzCounterStore, package: internal/counter }
          - { target: FuzzCounterCodec, package: internal/counter }
    steps:
      - uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true
          cache-dependency-path: go.mod

      - name: Set up just
        uses: extractions/setup-just@v4
        with:
          just-version: "1"

      - name: Fuzz ${{ matrix.target }}
        env:
          GOMAXPROCS: "1"
        run: just fuzz-one ${{ matrix.target }} ${{ matrix.package }}
