name: CI

on:
  workflow_run:
    workflows: ["Docker CI Image"]
    types: [completed]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.workflow_run.head_branch || github.ref }}
  cancel-in-progress: true

env:
  SCCACHE_GHA_ENABLED: "true"
  SCCACHE_GHA_VERSION: "1"

jobs:
  build-test:
    strategy:
      fail-fast: false
      matrix:
        include:
          - preset: debug
            label: GCC Debug
            family: gcc
          - preset: debug-tls
            label: GCC Debug + TLS
            family: gcc
          - preset: release
            label: GCC Release
            family: gcc
          - preset: debug-clang
            label: Clang Debug
            family: clang
          - preset: debug-tls-clang
            label: Clang Debug + TLS
            family: clang
          - preset: release-clang
            label: Clang Release
            family: clang
          - preset: asan-clang
            label: Clang ASan+UBSan
            family: clang
    runs-on: ubuntu-26.04
    container:
      image: ghcr.io/kraytos17/cinder-ci:latest
    name: ${{ matrix.label }}
    if: github.event.workflow_run.conclusion == 'success' || github.event_name == 'workflow_dispatch'
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.workflow_run.head_sha }}

      - name: Install sccache
        uses: Mozilla-Actions/sccache-action@v0.0.11

      - name: Restore FetchContent
        id: fc-restore
        uses: actions/cache/restore@v6
        with:
          path: ${{ github.workspace }}/.cache
          key: fetchcontent-${{ matrix.family }}-${{ matrix.preset }}-${{ hashFiles('CMakeLists.txt') }}
          restore-keys: fetchcontent-${{ matrix.family }}-

      - name: Configure
        run: cmake --preset ${{ matrix.preset }}

      - name: Build
        run: cmake --build --preset ${{ matrix.preset }} -j$(nproc)

      - name: Unit tests
        run: ctest --preset ${{ matrix.preset }} -L unit --output-on-failure

      - name: Sim tests
        run: ctest --preset ${{ matrix.preset }} -L sim --output-on-failure

      - name: CLI tests
        run: ctest --preset ${{ matrix.preset }} -L cli --output-on-failure

      - name: Save FetchContent
        if: always() && steps.fc-restore.outputs.cache-hit != 'true'
        continue-on-error: true
        uses: actions/cache/save@v6
        with:
          path: ${{ github.workspace }}/.cache
          key: fetchcontent-${{ matrix.family }}-${{ matrix.preset }}-${{ hashFiles('CMakeLists.txt') }}

      - name: Upload test logs
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: test-logs-${{ matrix.preset }}
          path: build/${{ matrix.preset }}/Testing/Temporary/LastTest.log
          if-no-files-found: ignore
          retention-days: 7

  feature-flags:
    strategy:
      fail-fast: false
      matrix:
        include:
          - preset: tls-grpc
            label: TLS + gRPC (GCC)
            family: gcc
          - preset: tls-grpc-clang
            label: TLS + gRPC (Clang)
            family: clang
    runs-on: ubuntu-26.04
    container:
      image: ghcr.io/kraytos17/cinder-ci:latest
    name: Feature Flags (${{ matrix.label }})
    if: github.event.workflow_run.conclusion == 'success' || github.event_name == 'workflow_dispatch'
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.workflow_run.head_sha }}

      - name: Install sccache
        uses: Mozilla-Actions/sccache-action@v0.0.11

      - name: Restore FetchContent
        id: fc-restore
        uses: actions/cache/restore@v6
        with:
          path: ${{ github.workspace }}/.cache
          key: fetchcontent-${{ matrix.family }}-${{ matrix.preset }}-${{ hashFiles('CMakeLists.txt') }}
          restore-keys: fetchcontent-${{ matrix.family }}-

      - name: Configure (TLS + gRPC)
        run: cmake --preset ${{ matrix.preset }}

      - name: Build
        run: cmake --build --preset ${{ matrix.preset }} -j$(nproc)

      - name: Unit tests
        run: ctest --preset ${{ matrix.preset }} -L unit --output-on-failure

      - name: Save FetchContent
        if: always() && steps.fc-restore.outputs.cache-hit != 'true'
        continue-on-error: true
        uses: actions/cache/save@v6
        with:
          path: ${{ github.workspace }}/.cache
          key: fetchcontent-${{ matrix.family }}-${{ matrix.preset }}-${{ hashFiles('CMakeLists.txt') }}

  sanitize:
    runs-on: ubuntu-26.04
    container:
      image: ghcr.io/kraytos17/cinder-ci:latest
    name: Sanitizers (GCC)
    if: github.event.workflow_run.conclusion == 'success' || github.event_name == 'workflow_dispatch'
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.workflow_run.head_sha }}

      - name: Install sccache
        uses: Mozilla-Actions/sccache-action@v0.0.11

      - name: Restore FetchContent
        id: fc-restore
        uses: actions/cache/restore@v6
        with:
          path: ${{ github.workspace }}/.cache
          key: fetchcontent-gcc-ci-gcc-${{ hashFiles('CMakeLists.txt') }}
          restore-keys: fetchcontent-gcc-

      - name: Configure
        run: cmake --preset ci-gcc

      - name: Build
        run: cmake --build --preset ci-gcc -j$(nproc)

      - name: Unit tests
        run: ctest --preset ci-gcc -L unit --output-on-failure

      - name: Sim tests
        run: ctest --preset ci-gcc -L sim --output-on-failure

      - name: CLI tests
        run: ctest --preset ci-gcc -L cli --output-on-failure

      - name: Save FetchContent
        if: always() && steps.fc-restore.outputs.cache-hit != 'true'
        continue-on-error: true
        uses: actions/cache/save@v6
        with:
          path: ${{ github.workspace }}/.cache
          key: fetchcontent-gcc-ci-gcc-${{ hashFiles('CMakeLists.txt') }}

      - name: Upload test logs
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: test-logs-sanitize
          path: build/ci-gcc/Testing/Temporary/LastTest.log
          if-no-files-found: ignore
          retention-days: 7

  tsan:
    strategy:
      fail-fast: false
      matrix:
        include:
          - preset: tsan
            label: TSan (GCC)
            family: gcc
          - preset: tsan-clang
            label: TSan (Clang)
            family: clang
    runs-on: ubuntu-26.04
    container:
      image: ghcr.io/kraytos17/cinder-ci:latest
    name: ${{ matrix.label }}
    if: github.event.workflow_run.conclusion == 'success' || github.event_name == 'workflow_dispatch'
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.workflow_run.head_sha }}

      - name: Install sccache
        uses: Mozilla-Actions/sccache-action@v0.0.11

      - name: Restore FetchContent
        id: fc-restore
        uses: actions/cache/restore@v6
        with:
          path: ${{ github.workspace }}/.cache
          key: fetchcontent-${{ matrix.family }}-${{ matrix.preset }}-${{ hashFiles('CMakeLists.txt') }}
          restore-keys: fetchcontent-${{ matrix.family }}-

      - name: Configure
        run: cmake --preset ${{ matrix.preset }}

      - name: Build
        run: cmake --build --preset ${{ matrix.preset }} -j$(nproc)

      - name: Unit tests
        run: ctest --preset ${{ matrix.preset }} -L unit --output-on-failure

      - name: Sim tests
        run: ctest --preset ${{ matrix.preset }} -L sim --output-on-failure

      - name: CLI tests
        run: ctest --preset ${{ matrix.preset }} -L cli --output-on-failure

      - name: Save FetchContent
        if: always() && steps.fc-restore.outputs.cache-hit != 'true'
        continue-on-error: true
        uses: actions/cache/save@v6
        with:
          path: ${{ github.workspace }}/.cache
          key: fetchcontent-${{ matrix.family }}-${{ matrix.preset }}-${{ hashFiles('CMakeLists.txt') }}

      - name: Upload test logs
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: test-logs-${{ matrix.preset }}
          path: build/${{ matrix.preset }}/Testing/Temporary/LastTest.log
          if-no-files-found: ignore
          retention-days: 7

  lint:
    runs-on: ubuntu-26.04
    container:
      image: ghcr.io/kraytos17/cinder-ci:latest
    name: Lint (Clang + cppcheck)
    if: github.event.workflow_run.conclusion == 'success' || github.event_name == 'workflow_dispatch'
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.workflow_run.head_sha }}

      - name: Install sccache
        uses: Mozilla-Actions/sccache-action@v0.0.11

      - name: Restore FetchContent (GCC)
        id: fc-restore-gcc
        uses: actions/cache/restore@v6
        with:
          path: ${{ github.workspace }}/.cache
          key: fetchcontent-lint-${{ hashFiles('CMakeLists.txt') }}
          restore-keys: fetchcontent-gcc-

      - name: Restore FetchContent (Clang)
        id: fc-restore-clang
        uses: actions/cache/restore@v6
        with:
          path: ${{ github.workspace }}/.cache
          key: fetchcontent-lint-${{ hashFiles('CMakeLists.txt') }}
          restore-keys: fetchcontent-clang-

      - name: Configure (clang-tidy runs inline)
        run: cmake --preset ci

      - name: Build
        run: cmake --build --preset ci -j$(nproc)

      - name: Check formatting
        run: just check-format

      - name: Configure for cppcheck (GCC)
        run: cmake --preset ci-gcc

      - name: cppcheck
        run: just cppcheck

      - name: Save FetchContent
        if: always() && (steps.fc-restore-gcc.outputs.cache-hit != 'true' || steps.fc-restore-clang.outputs.cache-hit != 'true')
        continue-on-error: true
        uses: actions/cache/save@v6
        with:
          path: ${{ github.workspace }}/.cache
          key: fetchcontent-lint-${{ hashFiles('CMakeLists.txt') }}

  codeql:
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: Release
            category: release
          - label: TLS + gRPC
            category: tls-grpc
    runs-on: ubuntu-26.04
    container:
      image: ghcr.io/kraytos17/cinder-ci:latest
    name: CodeQL (${{ matrix.label }})
    if: github.event.workflow_run.conclusion == 'success' || github.event_name == 'workflow_dispatch'
    timeout-minutes: 60
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.workflow_run.head_sha }}

      - name: Install sccache
        uses: Mozilla-Actions/sccache-action@v0.0.11

      - name: Restore FetchContent
        id: fc-restore
        uses: actions/cache/restore@v6
        with:
          path: ${{ github.workspace }}/.cache
          key: fetchcontent-codeql-${{ matrix.category }}-${{ hashFiles('CMakeLists.txt') }}
          restore-keys: fetchcontent-gcc-

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v4
        with:
          languages: cpp

      - name: Configure (Release)
        if: matrix.category == 'release'
        run: cmake --preset release

      - name: Configure (TLS + gRPC)
        if: matrix.category == 'tls-grpc'
        run: cmake --preset tls-grpc

      - name: Build (Release)
        if: matrix.category == 'release'
        run: cmake --build --preset release -j$(nproc)

      - name: Build (TLS + gRPC)
        if: matrix.category == 'tls-grpc'
        run: cmake --build --preset tls-grpc -j$(nproc)

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v4
        with:
          category: "/variant:${{ matrix.category }}"

      - name: Save FetchContent
        if: always() && steps.fc-restore.outputs.cache-hit != 'true'
        continue-on-error: true
        uses: actions/cache/save@v6
        with:
          path: ${{ github.workspace }}/.cache
          key: fetchcontent-codeql-${{ matrix.category }}-${{ hashFiles('CMakeLists.txt') }}

  ci-success:
    name: CI Success
    if: always()
    needs: [build-test, feature-flags, sanitize, tsan, lint, codeql]
    runs-on: ubuntu-26.04
    timeout-minutes: 5
    steps:
      - name: Check all jobs succeeded
        run: |
          if [ "${{ github.event_name }}" = "workflow_run" ] && [ "${{ github.event.workflow_run.conclusion }}" != "success" ]; then
            echo "Docker CI Image workflow concluded with '${{ github.event.workflow_run.conclusion }}'; refusing to report success"
            exit 1
          fi
          echo "Job results:"
          echo '${{ toJSON(needs) }}' | jq -r 'to_entries[] | "  \(.key): \(.value.result)"'
          FAILURES=0
          for result in $(echo '${{ toJSON(needs) }}' | jq -r '.[].result'); do
            case "$result" in
              success|skipped) ;;
              *) FAILURES=1 ;;
            esac
          done
          if [ "$FAILURES" -ne 0 ]; then
            echo ""
            echo "One or more required jobs failed, were cancelled, or were skipped unexpectedly"
            exit 1
          fi
          echo "All required jobs passed"
