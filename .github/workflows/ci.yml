name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  SCCACHE_GHA_ENABLED: "true"
  SCCACHE_CACHE_VERSION: "1"

jobs:
  build-test:
    strategy:
      fail-fast: false
      matrix:
        include:
          - preset: debug
            label: GCC Debug
            compiler: gcc
          - preset: release
            label: GCC Release
            compiler: gcc
          - preset: debug-clang
            label: Clang Debug
            compiler: clang
    runs-on: ubuntu-26.04
    name: ${{ matrix.label }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      - name: Install system deps
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            ninja-build lld libssl-dev

      - name: Install sccache
        uses: Mozilla-Actions/sccache-action@v0.0.11

      - name: Install GCC 16
        if: matrix.compiler == 'gcc'
        uses: ./.github/actions/install-gcc16

      - name: Install Clang 22
        if: matrix.compiler == 'clang'
        uses: ./.github/actions/install-clang22

      - name: Install CMake & Ninja
        uses: lukka/get-cmake@latest

      - name: Install just
        uses: extractions/setup-just@v4

      - name: Cache FetchContent (gcc)
        if: matrix.compiler == 'gcc'
        uses: actions/cache@v6
        with:
          path: ${{ github.workspace }}/.cache/fetchcontent-gcc
          key: fetchcontent-gcc-${{ hashFiles('CMakeLists.txt') }}
          restore-keys: fetchcontent-gcc-

      - name: Cache FetchContent (clang)
        if: matrix.compiler == 'clang'
        uses: actions/cache@v6
        with:
          path: ${{ github.workspace }}/.cache/fetchcontent-clang
          key: fetchcontent-clang-${{ hashFiles('CMakeLists.txt') }}
          restore-keys: fetchcontent-clang-

      - name: Configure
        run: cmake --preset ${{ matrix.preset }}

      - name: Build
        run: cmake --build --preset ${{ matrix.preset }} -j$(nproc)

      - name: Unit tests
        run: ctest --preset ${{ matrix.preset }} -L unit --output-on-failure

      - name: Sim tests
        run: ctest --preset ${{ matrix.preset }} -L sim --output-on-failure

      - name: CLI tests
        run: ctest --preset ${{ matrix.preset }} -L cli --output-on-failure

      - name: Upload test logs
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: test-logs-${{ matrix.preset }}
          path: build/${{ matrix.preset }}/Testing/Temporary/LastTest.log
          if-no-files-found: ignore
          retention-days: 7

  feature-flags:
    runs-on: ubuntu-26.04
    name: Feature Flags (TLS + gRPC)
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      - name: Install system deps
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            ninja-build lld libssl-dev

      - name: Install sccache
        uses: Mozilla-Actions/sccache-action@v0.0.11

      - name: Install GCC 16
        uses: ./.github/actions/install-gcc16

      - name: Install CMake & Ninja
        uses: lukka/get-cmake@latest

      - name: Cache FetchContent (gcc)
        uses: actions/cache@v6
        with:
          path: ${{ github.workspace }}/.cache/fetchcontent-gcc
          key: fetchcontent-gcc-${{ hashFiles('CMakeLists.txt') }}
          restore-keys: fetchcontent-gcc-

      - name: Configure (TLS + gRPC)
        run: |
          cmake -B build/feature-flags \
            -G Ninja \
            -DCMAKE_BUILD_TYPE=Debug \
            -DCMAKE_C_COMPILER=gcc-16 \
            -DCMAKE_CXX_COMPILER=g++-16 \
            -DCMAKE_CXX_COMPILER_LAUNCHER=sccache \
            -DCMAKE_C_COMPILER_LAUNCHER=sccache \
            -DCINDER_ENABLE_TLS=ON \
            -DCINDER_ENABLE_GRPC=ON \
            -DCINDER_ENABLE_CRYPTO=ON

      - name: Build
        run: cmake --build build/feature-flags -j$(nproc)

      - name: Unit tests
        run: |
          cd build/feature-flags
          ctest -L unit --output-on-failure

  sanitize:
    runs-on: ubuntu-26.04
    name: Sanitizers (GCC)
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - name: Install system deps
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            ninja-build lld libssl-dev

      - name: Install sccache
        uses: Mozilla-Actions/sccache-action@v0.0.11

      - name: Install GCC 16
        uses: ./.github/actions/install-gcc16

      - name: Install CMake & Ninja
        uses: lukka/get-cmake@latest

      - name: Install just
        uses: extractions/setup-just@v4

      - name: Cache FetchContent (gcc)
        uses: actions/cache@v6
        with:
          path: ${{ github.workspace }}/.cache/fetchcontent-gcc
          key: fetchcontent-gcc-${{ hashFiles('CMakeLists.txt') }}
          restore-keys: fetchcontent-gcc-

      - name: Configure
        run: cmake --preset ci-gcc

      - name: Build
        run: cmake --build --preset ci-gcc -j$(nproc)

      - name: Unit tests
        run: ctest --preset ci-gcc -L unit --output-on-failure

      - name: Sim tests
        run: ctest --preset ci-gcc -L sim --output-on-failure

      - name: Upload test logs
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: test-logs-sanitize
          path: build/ci-gcc/Testing/Temporary/LastTest.log
          if-no-files-found: ignore
          retention-days: 7

  tsan:
    runs-on: ubuntu-26.04
    name: TSan (GCC)
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - name: Install system deps
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            ninja-build lld libssl-dev

      - name: Install sccache
        uses: Mozilla-Actions/sccache-action@v0.0.11

      - name: Install GCC 16
        uses: ./.github/actions/install-gcc16

      - name: Install CMake & Ninja
        uses: lukka/get-cmake@latest

      - name: Install just
        uses: extractions/setup-just@v4

      - name: Cache FetchContent (gcc)
        uses: actions/cache@v6
        with:
          path: ${{ github.workspace }}/.cache/fetchcontent-gcc
          key: fetchcontent-gcc-${{ hashFiles('CMakeLists.txt') }}
          restore-keys: fetchcontent-gcc-

      - name: Configure
        run: cmake --preset tsan

      - name: Build
        run: cmake --build --preset tsan -j$(nproc)

      - name: Unit tests
        run: ctest --preset tsan -L unit --output-on-failure

      - name: Sim tests
        run: ctest --preset tsan -L sim --output-on-failure

      - name: Upload test logs
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: test-logs-tsan
          path: build/tsan/Testing/Temporary/LastTest.log
          if-no-files-found: ignore
          retention-days: 7

  lint:
    runs-on: ubuntu-26.04
    name: Lint (Clang + cppcheck)
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      - name: Install system deps
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            ninja-build lld cppcheck libssl-dev

      - name: Install sccache
        uses: Mozilla-Actions/sccache-action@v0.0.11

      - name: Install Clang 22
        uses: ./.github/actions/install-clang22
        with:
          tools: 'clang-tools-extra'

      - name: Install CMake & Ninja
        uses: lukka/get-cmake@latest

      - name: Install just
        uses: extractions/setup-just@v4

      - name: Cache FetchContent (clang)
        uses: actions/cache@v6
        with:
          path: ${{ github.workspace }}/.cache/fetchcontent-clang
          key: fetchcontent-clang-${{ hashFiles('CMakeLists.txt') }}
          restore-keys: fetchcontent-clang-

      - name: Configure (clang-tidy runs inline)
        run: cmake --preset ci

      - name: Build
        run: cmake --build --preset ci -j$(nproc)

      - name: Check formatting
        run: just check-format

      - name: cppcheck
        run: just cppcheck

  codeql:
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: Release
            category: release
          - label: TLS + gRPC
            category: tls-grpc
    runs-on: ubuntu-26.04
    name: CodeQL (${{ matrix.label }})
    timeout-minutes: 20
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@v7

      - name: Install system deps
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            ninja-build lld libssl-dev

      - name: Install sccache
        uses: Mozilla-Actions/sccache-action@v0.0.11

      - name: Install GCC 16
        uses: ./.github/actions/install-gcc16

      - name: Install CMake & Ninja
        uses: lukka/get-cmake@latest

      - name: Cache FetchContent (gcc)
        uses: actions/cache@v6
        with:
          path: ${{ github.workspace }}/.cache/fetchcontent-gcc
          key: fetchcontent-gcc-${{ hashFiles('CMakeLists.txt') }}
          restore-keys: fetchcontent-gcc-

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v4
        with:
          languages: cpp

      - name: Configure (Release)
        if: matrix.category == 'release'
        run: cmake --preset release

      - name: Configure (TLS + gRPC)
        if: matrix.category == 'tls-grpc'
        run: |
          cmake -B build/codeql-tls-grpc -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_C_COMPILER=gcc-16 \
            -DCMAKE_CXX_COMPILER=g++-16 \
            -DCMAKE_CXX_COMPILER_LAUNCHER=sccache \
            -DCMAKE_C_COMPILER_LAUNCHER=sccache \
            -DCINDER_ENABLE_TLS=ON \
            -DCINDER_ENABLE_GRPC=ON \
            -DCINDER_ENABLE_CRYPTO=ON

      - name: Build (Release)
        if: matrix.category == 'release'
        run: cmake --build --preset release -j$(nproc)

      - name: Build (TLS + gRPC)
        if: matrix.category == 'tls-grpc'
        run: cmake --build build/codeql-tls-grpc -j$(nproc)

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v4
        with:
          category: "/variant:${{ matrix.category }}"

  ci-success:
    name: CI Success
    if: always()
    needs: [build-test, feature-flags, sanitize, tsan, lint, codeql]
    runs-on: ubuntu-26.04
    timeout-minutes: 5
    steps:
      - name: Check all jobs succeeded
        run: |
          echo "Job results:"
          echo '${{ toJSON(needs) }}' | jq -r 'to_entries[] | "  \(.key): \(.value.result)"'
          FAILURES=0
          for result in '${{ toJSON(needs) }}' | jq -r '.[].result'; do
            case "$result" in
              success|skipped) ;;
              *) FAILURES=1 ;;
            esac
          done
          if [ "$FAILURES" -ne 0 ]; then
            echo ""
            echo "One or more required jobs failed, were cancelled, or were skipped unexpectedly"
            exit 1
          fi
          echo "All required jobs passed"
