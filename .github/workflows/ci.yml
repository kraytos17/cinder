name: CI

on:
  push:
    branches: [main]
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - 'LICENSE'
  pull_request:
    branches: [main]
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - 'LICENSE'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-image:
    name: Build CI image
    runs-on: ubuntu-26.04
    timeout-minutes: 20
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    outputs:
      image-digest: ${{ steps.build.outputs.digest }}
      image-pushed: ${{ github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository }}
    steps:
      - uses: actions/checkout@v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GHCR
        if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/${{ github.repository }}-ci
          tags: |
            type=sha
            type=ref,event=pr
            type=raw,value=latest,enable=${{ github.event_name != 'pull_request' }}

      - name: Build and push
        id: build
        uses: docker/build-push-action@v7
        with:
          context: .github/docker
          push: ${{ github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: true
          sbom: true

      - name: Attest image provenance
        if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
        uses: actions/attest@v4
        with:
          subject-name: ghcr.io/kraytos17/cinder-ci
          subject-digest: ${{ steps.build.outputs.digest }}
          push-to-registry: true

  build-test:
    needs: [build-image]
    if: needs.build-image.outputs.image-pushed == 'true'
    strategy:
      fail-fast: false
      matrix:
        include:
          - preset: debug
            label: GCC Debug
            family: gcc
          - preset: debug-tls
            label: GCC Debug + TLS
            family: gcc
          - preset: release
            label: GCC Release
            family: gcc
          - preset: debug-clang
            label: Clang Debug
            family: clang
          - preset: debug-tls-clang
            label: Clang Debug + TLS
            family: clang
          - preset: release-clang
            label: Clang Release
            family: clang
          - preset: asan-clang
            label: Clang ASan+UBSan
            family: clang
    runs-on: ubuntu-26.04
    container:
      image: ghcr.io/kraytos17/cinder-ci@${{ needs.build-image.outputs.image-digest }}
    name: ${{ matrix.label }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      - name: Install sccache
        uses: Mozilla-Actions/sccache-action@v0.0.11

      - name: Restore FetchContent
        id: fc-restore
        uses: actions/cache/restore@v6
        with:
          path: ${{ github.workspace }}/.cache
          key: fetchcontent-${{ matrix.family }}-${{ matrix.preset }}-${{ hashFiles('CMakeLists.txt') }}
          restore-keys: fetchcontent-${{ matrix.family }}-

      - name: Configure
        run: cmake --preset ${{ matrix.preset }}

      - name: Build
        run: cmake --build --preset ${{ matrix.preset }} -j$(nproc)

      - name: Unit tests
        run: ctest --preset ${{ matrix.preset }} -L unit --output-on-failure

      - name: Sim tests
        run: ctest --preset ${{ matrix.preset }} -L sim --output-on-failure

      - name: CLI tests
        run: ctest --preset ${{ matrix.preset }} -L cli --output-on-failure

      - name: Save FetchContent
        if: always() && steps.fc-restore.outputs.cache-hit != 'true'
        continue-on-error: true
        uses: actions/cache/save@v6
        with:
          path: ${{ github.workspace }}/.cache
          key: fetchcontent-${{ matrix.family }}-${{ matrix.preset }}-${{ hashFiles('CMakeLists.txt') }}

      - name: Upload test logs
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: test-logs-${{ matrix.preset }}
          path: build/${{ matrix.preset }}/Testing/Temporary/LastTest.log
          if-no-files-found: ignore
          retention-days: 7

  feature-flags:
    needs: [build-image]
    if: needs.build-image.outputs.image-pushed == 'true'
    strategy:
      fail-fast: false
      matrix:
        include:
          - preset: tls-grpc
            label: TLS + gRPC (GCC)
            family: gcc
          - preset: tls-grpc-clang
            label: TLS + gRPC (Clang)
            family: clang
    runs-on: ubuntu-26.04
    container:
      image: ghcr.io/kraytos17/cinder-ci@${{ needs.build-image.outputs.image-digest }}
    name: Feature Flags (${{ matrix.label }})
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v7

      - name: Install sccache
        uses: Mozilla-Actions/sccache-action@v0.0.11

      - name: Restore FetchContent
        id: fc-restore
        uses: actions/cache/restore@v6
        with:
          path: ${{ github.workspace }}/.cache
          key: fetchcontent-${{ matrix.family }}-${{ matrix.preset }}-${{ hashFiles('CMakeLists.txt') }}
          restore-keys: fetchcontent-${{ matrix.family }}-

      - name: Configure (TLS + gRPC)
        run: cmake --preset ${{ matrix.preset }}

      - name: Build
        run: cmake --build --preset ${{ matrix.preset }} -j$(nproc)

      - name: Unit tests
        run: ctest --preset ${{ matrix.preset }} -L unit --output-on-failure

      - name: Save FetchContent
        if: always() && steps.fc-restore.outputs.cache-hit != 'true'
        continue-on-error: true
        uses: actions/cache/save@v6
        with:
          path: ${{ github.workspace }}/.cache
          key: fetchcontent-${{ matrix.family }}-${{ matrix.preset }}-${{ hashFiles('CMakeLists.txt') }}

  sanitize:
    needs: [build-image]
    if: needs.build-image.outputs.image-pushed == 'true'
    runs-on: ubuntu-26.04
    container:
      image: ghcr.io/kraytos17/cinder-ci@${{ needs.build-image.outputs.image-digest }}
    name: Sanitizers (GCC)
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - name: Install sccache
        uses: Mozilla-Actions/sccache-action@v0.0.11

      - name: Restore FetchContent
        id: fc-restore
        uses: actions/cache/restore@v6
        with:
          path: ${{ github.workspace }}/.cache
          key: fetchcontent-gcc-ci-gcc-${{ hashFiles('CMakeLists.txt') }}
          restore-keys: fetchcontent-gcc-

      - name: Configure
        run: cmake --preset ci-gcc

      - name: Build
        run: cmake --build --preset ci-gcc -j$(nproc)

      - name: Unit tests
        run: ctest --preset ci-gcc -L unit --output-on-failure

      - name: Sim tests
        run: ctest --preset ci-gcc -L sim --output-on-failure

      - name: CLI tests
        run: ctest --preset ci-gcc -L cli --output-on-failure

      - name: Save FetchContent
        if: always() && steps.fc-restore.outputs.cache-hit != 'true'
        continue-on-error: true
        uses: actions/cache/save@v6
        with:
          path: ${{ github.workspace }}/.cache
          key: fetchcontent-gcc-ci-gcc-${{ hashFiles('CMakeLists.txt') }}

      - name: Upload test logs
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: test-logs-sanitize
          path: build/ci-gcc/Testing/Temporary/LastTest.log
          if-no-files-found: ignore
          retention-days: 7

  tsan:
    needs: [build-image]
    if: needs.build-image.outputs.image-pushed == 'true'
    strategy:
      fail-fast: false
      matrix:
        include:
          - preset: tsan
            label: TSan (GCC)
            family: gcc
          - preset: tsan-clang
            label: TSan (Clang)
            family: clang
    runs-on: ubuntu-26.04
    container:
      image: ghcr.io/kraytos17/cinder-ci@${{ needs.build-image.outputs.image-digest }}
      # TSan needs personality(ADDR_NO_RANDOMIZE), which Docker's default
      # seccomp profile blocks — without this every TSan binary (including
      # gtest discovery runs) dies at startup. Scoped to this job only.
      options: --security-opt seccomp=unconfined
    name: ${{ matrix.label }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - name: Install sccache
        uses: Mozilla-Actions/sccache-action@v0.0.11

      - name: Restore FetchContent
        id: fc-restore
        uses: actions/cache/restore@v6
        with:
          path: ${{ github.workspace }}/.cache
          key: fetchcontent-${{ matrix.family }}-${{ matrix.preset }}-${{ hashFiles('CMakeLists.txt') }}
          restore-keys: fetchcontent-${{ matrix.family }}-

      - name: Configure
        run: cmake --preset ${{ matrix.preset }}

      - name: Build
        run: cmake --build --preset ${{ matrix.preset }} -j$(nproc)

      - name: Unit tests
        run: ctest --preset ${{ matrix.preset }} -L unit --output-on-failure

      - name: Sim tests
        run: ctest --preset ${{ matrix.preset }} -L sim --output-on-failure

      - name: CLI tests
        run: ctest --preset ${{ matrix.preset }} -L cli --output-on-failure

      - name: Save FetchContent
        if: always() && steps.fc-restore.outputs.cache-hit != 'true'
        continue-on-error: true
        uses: actions/cache/save@v6
        with:
          path: ${{ github.workspace }}/.cache
          key: fetchcontent-${{ matrix.family }}-${{ matrix.preset }}-${{ hashFiles('CMakeLists.txt') }}

      - name: Upload test logs
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: test-logs-${{ matrix.preset }}
          path: build/${{ matrix.preset }}/Testing/Temporary/LastTest.log
          if-no-files-found: ignore
          retention-days: 7

  lint:
    needs: [build-image]
    if: needs.build-image.outputs.image-pushed == 'true'
    runs-on: ubuntu-26.04
    container:
      image: ghcr.io/kraytos17/cinder-ci@${{ needs.build-image.outputs.image-digest }}
    name: Lint (Clang + cppcheck)
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      - name: Install sccache
        uses: Mozilla-Actions/sccache-action@v0.0.11

      - name: Restore FetchContent (GCC)
        id: fc-restore-gcc
        uses: actions/cache/restore@v6
        with:
          path: ${{ github.workspace }}/.cache
          key: fetchcontent-lint-${{ hashFiles('CMakeLists.txt') }}
          restore-keys: fetchcontent-gcc-

      - name: Restore FetchContent (Clang)
        id: fc-restore-clang
        uses: actions/cache/restore@v6
        with:
          path: ${{ github.workspace }}/.cache
          key: fetchcontent-lint-${{ hashFiles('CMakeLists.txt') }}
          restore-keys: fetchcontent-clang-

      - name: Configure (clang-tidy runs inline)
        run: just preset=ci configure

      - name: Build
        run: just preset=ci build

      - name: Check formatting
        run: just preset=ci check-format

      - name: Configure for cppcheck (GCC)
        run: just preset=ci-gcc configure

      - name: cppcheck
        run: cmake --build build/ci-gcc --target cppcheck

      - name: Save FetchContent
        if: always() && (steps.fc-restore-gcc.outputs.cache-hit != 'true' || steps.fc-restore-clang.outputs.cache-hit != 'true')
        continue-on-error: true
        uses: actions/cache/save@v6
        with:
          path: ${{ github.workspace }}/.cache
          key: fetchcontent-lint-${{ hashFiles('CMakeLists.txt') }}

  codeql:
    needs: [build-image]
    if: needs.build-image.outputs.image-pushed == 'true'
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: Release
            category: release
          - label: TLS + gRPC
            category: tls-grpc
    runs-on: ubuntu-26.04
    container:
      image: ghcr.io/kraytos17/cinder-ci@${{ needs.build-image.outputs.image-digest }}
    name: CodeQL (${{ matrix.label }})
    timeout-minutes: 90
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@v7

      - name: Install sccache
        uses: Mozilla-Actions/sccache-action@v0.0.11

      - name: Restore FetchContent
        id: fc-restore
        uses: actions/cache/restore@v6
        with:
          path: ${{ github.workspace }}/.cache
          key: fetchcontent-codeql-${{ matrix.category }}-${{ hashFiles('CMakeLists.txt') }}
          restore-keys: fetchcontent-gcc-

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v4
        with:
          languages: cpp

      - name: Configure (Release)
        if: matrix.category == 'release'
        run: cmake --preset release

      - name: Configure (TLS + gRPC)
        if: matrix.category == 'tls-grpc'
        run: cmake --preset tls-grpc

      - name: Build (Release)
        if: matrix.category == 'release'
        run: cmake --build --preset release -j$(nproc)

      - name: Build (TLS + gRPC)
        if: matrix.category == 'tls-grpc'
        run: cmake --build --preset tls-grpc -j$(nproc)

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v4
        with:
          category: "/variant:${{ matrix.category }}"

      - name: Save FetchContent
        if: always() && steps.fc-restore.outputs.cache-hit != 'true'
        continue-on-error: true
        uses: actions/cache/save@v6
        with:
          path: ${{ github.workspace }}/.cache
          key: fetchcontent-codeql-${{ matrix.category }}-${{ hashFiles('CMakeLists.txt') }}

  ci-success:
    name: CI Success
    if: always()
    needs: [build-image, build-test, feature-flags, sanitize, tsan, lint, codeql]
    runs-on: ubuntu-26.04
    timeout-minutes: 5
    steps:
      - name: Check all jobs succeeded
        run: |
          echo "Job results:"
          echo '${{ toJSON(needs) }}' | jq -r 'to_entries[] | "  \(.key): \(.value.result)"'
          # The image build must succeed outright: if it fails, the matrix is
          # skipped, and skipped results below would otherwise read as green.
          if [ '${{ needs.build-image.result }}' != 'success' ]; then
            echo "Build CI image failed or was cancelled; refusing to report success"
            exit 1
          fi
          # Remaining jobs tolerate 'skipped': fork PRs cannot push the image,
          # so the matrix is skipped by design and only the image build ran.
          FAILURES=0
          for result in $(echo '${{ toJSON(needs) }}' | jq -r '.[].result'); do
            case "$result" in
              success|skipped) ;;
              *) FAILURES=1 ;;
            esac
          done
          if [ "$FAILURES" -ne 0 ]; then
            echo ""
            echo "One or more required jobs failed or were cancelled"
            exit 1
          fi
          echo "All required jobs passed"
