name: ci-setup
description: Restore ccache and the read-only dependency source cache

inputs:
  ccache-key:
    description: Unique ccache key suffix per preset
    required: true

runs:
  using: composite
  steps:
    - name: Restore ccache
      uses: hendrikmuhs/ccache-action@v1.2.24
      with:
        key: ccache-${{ inputs.ccache-key }}
        max-size: 2G
        save: ${{ github.ref == 'refs/heads/main' }}
    - name: Restore dependency cache
      uses: actions/cache/restore@v6
      with:
        path: ~/.cache/cinder/deps
        key: deps-${{ hashFiles('CMakeLists.txt', 'cmake/**') }}
        restore-keys: |
          deps-
