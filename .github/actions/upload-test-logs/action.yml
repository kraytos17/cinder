name: upload-test-logs
description: Upload a ctest LastTest.log on failure

inputs:
  name:
    description: Artifact name
    required: true
  path:
    description: Log path to upload
    required: true

runs:
  using: composite
  steps:
    - name: Upload test logs
      uses: actions/upload-artifact@v7
      with:
        name: ${{ inputs.name }}
        path: ${{ inputs.path }}
        if-no-files-found: ignore
        retention-days: 7
