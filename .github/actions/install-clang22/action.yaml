name: 'Install Clang 22.1.8'
description: 'Installs Clang/LLVM 22.1.8 via micromamba'

inputs:
  tools:
    description: 'Extra tools, e.g. "clang-tools-extra"'
    required: false
    default: ''

runs:
  using: composite
  steps:
    - uses: mamba-org/setup-micromamba@v2
      with:
        environment-name: llvm22
        create-args: >-
          -c conda-forge
          clangxx=22.1.8
          lld=22.1.8
          ${{ inputs.tools }}
        cache-environment: true

    - name: Setup Toolchain Aliases & Exports
      shell: bash
      run: |
        PREFIX="/opt/micromamba/envs/llvm22/bin"
        ln -sf "$PREFIX/clang" "$PREFIX/clang-22"
        ln -sf "$PREFIX/clang++" "$PREFIX/clang++-22"

        for t in ${{ inputs.tools }}; do
          if [ -f "$PREFIX/$t" ]; then
            ln -sf "$PREFIX/$t" "$PREFIX/$t-22"
          fi
        done

        echo "CC=$PREFIX/clang-22" >> "$GITHUB_ENV"
        echo "CXX=$PREFIX/clang++-22" >> "$GITHUB_ENV"
        echo "CONDA_PREFIX=/opt/micromamba/envs/llvm22" >> "$GITHUB_ENV"
        echo "$PREFIX" >> "$GITHUB_PATH"
