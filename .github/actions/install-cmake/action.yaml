name: 'Install CMake'
description: 'Installs CMake via pip, with a pip download cache'

inputs:
  version-spec:
    description: 'pip version specifier, e.g. ">=4.4"'
    required: false
    default: '>=4.4'

runs:
  using: composite
  steps:
    - name: Cache pip downloads
      uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.2.0
      with:
        path: ~/.cache/pip
        key: pip-cmake-${{ runner.os }}-v1

    - name: Install CMake
      shell: bash
      run: pip install "cmake${{ inputs.version-spec }}"
