name: 'Install GCC 16'
description: 'Installs GCC 16 + G++ 16 via the ubuntu-toolchain-r PPA, with apt package caching, and exports CC/CXX'

runs:
  using: composite
  steps:
    - name: Cache apt archives (gcc-16)
      uses: actions/cache@v6
      with:
        path: /var/cache/apt/archives
        key: apt-gcc16-${{ runner.os }}-v1

    - name: Add toolchain PPA
      shell: bash
      run: sudo add-apt-repository -y ppa:ubuntu-toolchain-r/test

    - name: Install gcc-16 / g++-16
      shell: bash
      run: |
        sudo apt-get update -qq
        sudo apt-get install -y --no-install-recommends gcc-16 g++-16

    - name: Export CC/CXX
      shell: bash
      run: |
        echo "CC=gcc-16" >> "$GITHUB_ENV"
        echo "CXX=g++-16" >> "$GITHUB_ENV"
