name: 'Install GCC 16'
description: 'Installs GCC 16 + G++ 16 via the ubuntu-toolchain-r PPA, with apt package caching, and exports CC/CXX'

runs:
  using: composite
  steps:
    - name: Cache apt archives (gcc-16)
      uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.2.0
      with:
        path: /var/cache/apt/archives
        key: apt-gcc16-${{ runner.os }}-v1

    - name: Add toolchain PPA
      shell: bash
      run: sudo add-apt-repository -y ppa:ubuntu-toolchain-r/test

    - name: Install gcc-16 / g++-16
      shell: bash
      run: |
        sudo apt-get update -qq
        sudo apt-get install -y --no-install-recommends gcc-16 g++-16

    # No update-alternatives here on purpose: every consumer of this action
    # either uses the exported CC/CXX env vars below or passes
    # -DCMAKE_C_COMPILER=gcc-16 / -DCMAKE_CXX_COMPILER=g++-16 explicitly.
    # Nothing in this pipeline invokes a bare `gcc`/`g++`.
    - name: Export CC/CXX
      shell: bash
      run: |
        echo "CC=gcc-16" >> "$GITHUB_ENV"
        echo "CXX=g++-16" >> "$GITHUB_ENV"
