name: 'Install GCC 16.2.1'
description: 'Installs GCC 16.2.1 via micromamba'

runs:
  using: composite
  steps:
    - uses: mamba-org/setup-micromamba@v3
      with:
        environment-name: gcc16
        create-args: >-
          -c conda-forge
          gcc_linux-64>=16
          gxx_linux-64>=16
        cache-environment: true

    - name: Setup Compiler Aliases & Exports
      shell: bash
      run: |
        PREFIX="/opt/micromamba/envs/gcc16/bin"
        # Conda installs target-prefixed binaries
        ln -sf "$PREFIX/x86_64-conda-linux-gnu-gcc" "$PREFIX/gcc-16"
        ln -sf "$PREFIX/x86_64-conda-linux-gnu-g++" "$PREFIX/g++-16"
        ln -sf "$PREFIX/x86_64-conda-linux-gnu-gcc" "$PREFIX/gcc"
        ln -sf "$PREFIX/x86_64-conda-linux-gnu-g++" "$PREFIX/g++"

        echo "CC=$PREFIX/gcc-16" >> "$GITHUB_ENV"
        echo "CXX=$PREFIX/g++-16" >> "$GITHUB_ENV"
        echo "CONDA_PREFIX=/opt/micromamba/envs/gcc16" >> "$GITHUB_ENV"
        echo "$PREFIX" >> "$GITHUB_PATH"
