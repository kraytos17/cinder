# Codegen for internal/grpcgw/gen. buf compiles the proto itself — no
# protoc binary involved. Plugins run through `go tool`, so the exact
# versions pinned in go.mod (tool directives) do the generation on any
# machine with only the Go toolchain. `paths=source_relative`-equivalent
# layout keeps the existing flat gen/ directory (see the mv step in the
# Justfile recipe).
version: v2
plugins:
  - local: ["go", "tool", "google.golang.org/protobuf/cmd/protoc-gen-go"]
    out: internal/grpcgw/gen
    opt:
      - paths=source_relative
      - Mcinder/v1/cache.proto=github.com/kraytos17/cinder/internal/grpcgw/gen
  - local: ["go", "tool", "google.golang.org/grpc/cmd/protoc-gen-go-grpc"]
    out: internal/grpcgw/gen
    opt:
      - paths=source_relative
      - Mcinder/v1/cache.proto=github.com/kraytos17/cinder/internal/grpcgw/gen
