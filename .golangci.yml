version: "2"

run:
  timeout: 10m

linters:
  default: all
  disable:
    # Naming, import, and formatting preferences.
    - depguard
    - varnamelen
    - lll
    - wsl
    - wsl_v5
    - godoclint
    - godot
    - nlreturn

    # Struct/API design preferences.
    - exhaustruct
    - exhaustruct_v5
    - ireturn
    - nonamedreturns
    - wrapcheck
    - noinlineerr
    - funcorder
    - recvcheck

    # Test conventions.
    - testpackage
    - thelper
    - paralleltest
    - testableexamples

    # Complexity and maintainability.
    - cyclop
    - funlen
    - gocognit
    - goconst
    - maintidx
    - nestif
    - mnd

    # Globals, initialization, and miscellaneous.
    - forbidigo
    - gochecknoglobals
    - gochecknoinits
    - musttag
    - perfsprint
    - rowserrcheck
    - sqlclosecheck
    - tagalign
    - tagliatelle

    # Error handling and TODO conventions.
    - errcheck
    - err113
    - godox

    - gomodguard

  enable:
    # Context and concurrency safety.
    - fatcontext
    - containedctx
    - contextcheck
    - copyloopvar
    - intrange

    # Error handling.
    - nilerr
    - nilnil
    - errchkjson

    # Code quality and modernization.
    - exhaustive
    - modernize
    - gocritic
    - unparam
    - unconvert
    - misspell
    - whitespace
    - revive

    # Static analysis.
    - staticcheck
    - unused
    - ineffassign
    - govet
    - usestdlibvars

    # Networking, metrics, and logging.
    - noctx
    - promlinter
    - zerologlint

    # Testing.
    - testifylint

  settings:
    staticcheck:
      checks:
        - all
        - -ST1000
        - -ST1003
        - -ST1016

    revive:
      rules:
        - name: package-comments
          disabled: true

    misspell:
      locale: US

    gocyclo:
      min-complexity: 50

    exhaustive:
      default-signifies-exhaustive: true

  exclusions:
    generated: lax

    rules:
      # Generated gRPC gateway code.
      - path: internal/grpcgw/gen/*
        linters:
          - all

      # Test-specific exclusions.
      - path: _test\.go
        linters:
          - forcetypeassert
          - err113
          - noctx
          - protogetter
          - unparam
          - revive
          - copyloopvar
          - gosec

      # Gosec rules explicitly triaged as by-design.
      - linters:
          - gosec
        text: "G104: Errors unhandled|G115: integer overflow|G304: Potential file inclusion|G301: Expect directory permissions|G302: Expect file permissions|G306: Expect WriteFile permissions|G404: Use of weak random"

    paths:
      - internal/grpcgw/gen/*

formatters:
  enable:
    - gofumpt
    - goimports

  settings:
    goimports:
      local-prefixes:
        - github.com/kraytos17/cinder

  exclusions:
    generated: lax
    paths:
      - internal/grpcgw/gen/*

issues:
  max-issues-per-linter: 50
  max-same-issues: 20
